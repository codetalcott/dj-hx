[project]
name = "dj-hx"
version = "0.2.2"
description = "Handler-first htmx 4 for Django: the view names the outcome, the template keeps the controls. Also checks every {% url %} and every template variable, for any Django project"
authors = [{name = "William Talcott"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["django", "htmx", "hypermedia", "partials", "htmx4", "templates", "checks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2",
]

[project.urls]
Homepage = "https://github.com/codetalcott/dj-hx"
Source = "https://github.com/codetalcott/dj-hx"
Changelog = "https://github.com/codetalcott/dj-hx/blob/main/CHANGELOG.md"
Issues = "https://github.com/codetalcott/dj-hx/issues"

[project.optional-dependencies]
# Template partials on Django 5.2; Django 6.0 has them built in.
partials = ["django-template-partials"]
browser = ["playwright"]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0",
    "pytest-django>=4.5",
    "mypy>=1.0",
    "django-stubs>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dj_hx"]

[tool.mypy]
# The Typing :: Typed classifier is a claim; CI's lint job runs `mypy dj_hx` and, as a project would,
# `mypy --strict --follow-imports=silent tests/typed_consumer.py` (README's idioms) to keep it true.
files = ["dj_hx"]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# What a project's code calls, and what that calls: every function annotated, so none hands a project Any.
module = [
    "dj_hx.errors", "dj_hx.guard", "dj_hx.interactions", "dj_hx.messages",
    "dj_hx.middleware", "dj_hx.request", "dj_hx.testing", "dj_hx.verbs",
]
disallow_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored from hx-flask verbatim; formatted there.
exclude = ["dj_hx/hxlint.py", "dj_hx/hx_vocab.py", "dj_hx/mapcore.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "Q", "UP", "W"]
# N818: the exception names mirror hx-flask (HxPageIntoFragment, HxNoSwap) on purpose.
ignore = ["E501", "N818"]
