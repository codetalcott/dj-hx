name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Python each Django line supports.
        include:
          - { python: "3.10", django: "~=4.2.0" }
          - { python: "3.12", django: "~=4.2.0" }
          - { python: "3.10", django: "~=5.2.0" }
          - { python: "3.13", django: "~=5.2.0" }
          - { python: "3.12", django: "~=6.0.0" }
          - { python: "3.13", django: "~=6.0.0" }
    name: test (py${{ matrix.python }}, django${{ matrix.django }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,browser,partials]" "django${{ matrix.django }}"
      - run: playwright install --with-deps chromium
      - run: pytest -q
