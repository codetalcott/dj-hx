name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy dj_hx
      # README's idioms checked as a project checks its views: strict, dj-hx's modules analysed but not reported.
      - run: mypy --strict --follow-imports=silent tests/typed_consumer.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Python each Django line supports, within README's 3.10 to 3.13,
        # plus 3.11 on 5.2, so every Python README names runs.
        include:
          - { python: "3.10", django: "~=4.2.0" }
          - { python: "3.12", django: "~=4.2.0" }
          - { python: "3.10", django: "~=5.2.0" }
          - { python: "3.11", django: "~=5.2.0" }
          - { python: "3.13", django: "~=5.2.0" }
          - { python: "3.12", django: "~=6.0.0" }
          - { python: "3.13", django: "~=6.0.0" }
          - { python: "3.12", django: "~=6.1.0" }
          - { python: "3.13", django: "~=6.1.0" }
    name: test (py${{ matrix.python }}, django${{ matrix.django }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,browser,partials]" "django${{ matrix.django }}"
      - run: playwright install --with-deps chromium
      - run: pytest -q

  canary:
    # Django's main branch, not required and never blocking. HxTestClient's undefined-variable check
    # rests on Django internals its documentation does not promise (README, Testing), and a change to
    # them makes the check go quiet rather than fail; this job is where that shows first.
    runs-on: ubuntu-latest
    continue-on-error: true
    name: canary (py3.13, django main)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,browser]" "django @ git+https://github.com/django/django.git@main"
      - run: playwright install --with-deps chromium
      - run: pytest -q

  ci:
    # The one check branch protection requires. Editing the matrix above cannot
    # silently drop a required check, or leave one pinned by name that never
    # reports and blocks the pull request forever.
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - run: |
          echo "lint: ${{ needs.lint.result }}  test: ${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]
